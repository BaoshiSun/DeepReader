name: macOS build and tests
on:
  push:
    branches: ['codex/macos-native']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check public sources
        run: python3 tools/public_release.py --check-tracked
      - name: Check distribution preparation tools offline
        run: |
          bash -n macos/distribute.sh
          python3 -m unittest discover -s tests -p test_distribution.py -v
      - name: Prepare synthetic and hash-pinned ebook fixtures
        run: python3 macos/Tests/make_format_fixtures.py --upstream
      - name: Offline unit and document integration tests
        working-directory: macos
        run: swift test
      - name: Build universal app and run packaged smoke test
        if: matrix.os == 'macos-15'
        run: bash macos/build.sh
      - name: Validate native App Store archive without signing
        if: matrix.os == 'macos-15'
        run: |
          python3 macos/prepare_app_store.py
          xcodebuild -project macos/DeepReader.xcodeproj -scheme DeepReaderStore -configuration Release \
            -destination 'generic/platform=macOS' -archivePath artifacts/app-store/DeepReader-unsigned.xcarchive \
            -derivedDataPath artifacts/app-store/DerivedData CODE_SIGNING_ALLOWED=NO archive
      - name: Keep universal installation packages
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: DeepReader-macOS-universal
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Keep offline smoke evidence
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-smoke-evidence
          path: |
            macos/dist/smoke/*.png
            macos/dist/smoke/smoke-result.txt
          if-no-files-found: ignore
