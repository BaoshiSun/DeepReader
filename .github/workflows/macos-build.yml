name: macOS build and tests
on:
  push:
    branches: ['codex/main', 'codex/macos-native']
  pull_request:
    paths: ['macos/**', 'ios/Sources/LocalQwen.swift', 'ios/prepare_local_model.py', '.github/workflows/macos-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public sources
        run: python3 tools/public_release.py --check-tracked
      - name: Check distribution preparation tools offline
        run: |
          bash -n macos/distribute.sh
          python3 -m unittest discover -s tests -p test_distribution.py -v
      - name: Prepare synthetic and hash-pinned ebook fixtures
        run: python3 macos/Tests/make_format_fixtures.py --upstream
      - name: Offline unit and document integration tests
        working-directory: macos
        run: swift test
      - name: Prepare local inference dependencies
        run: python3 ios/prepare_local_model.py --dependencies-only
      - name: Build offline universal app and run packaged inference test
        if: matrix.os == 'macos-15'
        run: bash macos/build_offline.sh artifacts/macos-offline
      - name: Validate native App Store archive without signing
        if: matrix.os == 'macos-15'
        run: |
          python3 macos/prepare_app_store.py
          xcodebuild -project macos/DeepReader.xcodeproj -scheme DeepReaderStore -configuration Release \
            -destination 'generic/platform=macOS' -archivePath artifacts/app-store/DeepReader-unsigned.xcarchive \
            -derivedDataPath artifacts/app-store/DerivedData CODE_SIGNING_ALLOWED=NO archive
      - name: Keep universal installation packages
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: DeepReader-macOS-universal
          path: |
            artifacts/macos-offline/*.zip
            artifacts/macos-offline/SHA256SUMS.txt
          if-no-files-found: error
      - name: Keep offline smoke evidence
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-smoke-evidence
          path: |
            artifacts/macos-offline/smoke/*.png
            artifacts/macos-offline/smoke/smoke-result.txt
            artifacts/macos-offline/offline-check.txt
          if-no-files-found: ignore
